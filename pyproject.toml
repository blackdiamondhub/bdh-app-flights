[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bdh-app-flights"
version = "0.1.3b2"
description = "Black Diamond Hub app: track flights with FlightAware and get delay, gate and landing alerts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "bdh-sdk[ha]>=0.28,<1",
    "requests>=2.31",
]

[project.urls]
Source = "https://github.com/blackdiamondlodge/bdh-app-flights"

[project.entry-points."blackdiamondhub.plugins"]
flights = "flights.plugin:spec"

[tool.setuptools.packages.find]
include = ["flights", "flights.*"]

[tool.setuptools.package-data]
flights = [
    "templates/**/*",
    "static/**/*",
    "data/*.tsv",
]
